[package]
name = "utils"
version = "0.1.0"
authors = ["Amazon Firecracker team <firecracker-devel@amazon.com>"]
edition = "2024"
license = "Apache-2.0"

[lib]
bench = false

[features]
seccomp = ["dep:bitflags"]
tracing = ["log-instrument"]
test-utils = []

[dependencies]
bitflags = { version = "2.12.1", optional = true }
displaydoc = "0.2.6"
libc = "0.2.186"
log-instrument = { path = "../log-instrument", optional = true }
thiserror = "2.0.18"

[lints]
workspace = true
