[package]
name = "log-instrument"
version = "0.3.0"
authors = ["Amazon Firecracker team <firecracker-devel@amazon.com>"]
edition = "2024"
description = "Offers an attribute procedural macro that adds `log::trace!` events at the start and end of attributed functions."
license = "Apache-2.0"

[lib]
bench = false

[dependencies]
log = { version = "0.4.31", default-features = false }
log-instrument-macros = { path = "../log-instrument-macros" }

[dev-dependencies]
env_logger = { version = "0.11.10", default-features = false, features = [
    "humantime",
] }

[[example]]
name = "one"

[[example]]
name = "two"

[[example]]
name = "three"

[[example]]
name = "four"

[[example]]
name = "five"

[[example]]
name = "six"

