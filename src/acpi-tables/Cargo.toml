[package]
name = "acpi_tables"
version = "0.1.0"
authors = [
    "The Cloud Hypervisor Authors",
    "Amazon Firecracker team <firecracker-devel@amazon.com>",
]
edition = "2024"
license = "Apache-2.0"

[lib]
bench = false
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
displaydoc = { version = "0.2.6", default-features = false, features = ["std"] }
thiserror = { version = "2.0.18", default-features = false, features = ["std"] }
vm-memory = { version = "0.18.0", default-features = false, features = [
    "rawfd",
    "backend-mmap",
    "backend-bitmap",
] }
zerocopy = { version = "0.8.50", default-features = false, features = [
    "derive",
] }

[lints]
workspace = true
