[tool.poetry]
name = "tool.poetry"
version = "0.1.0"
description = "Firecracker python dependencies"
authors = ["Your Name <you@example.com>"]
package-mode = false

[tool.poetry.dependencies]
aws-embedded-metrics = "^3.1.0"
black = "^26.3.1"
# Gitlint locks this to 8.1.3. Lock from our side too to prevent different versions
click = "8.1.3"
filelock = "^4.2.4"
gitlint = "^0.19.1"
ipython = "^9.19.1"
isort = "^9.0.2"
mdformat = "^1.0.0"
mdformat-footnote = "^0.1.1"
mdformat-frontmatter = "^2.2.0"
mdformat-gfm = "^1.0.0"
numpy = "^2.3.4"
openapi-spec-validator = "^0.9.0"
pandas = "^3.1.1"
psutil = "^7.2.2"
pylint = "^4.1.4"
# pytest 9.2.0 fails at startup when cache_dir contains "..", which ours does:
# https://github.com/pytest-dev/pytest/issues/15295
pytest = ">=8,<9.2"
pytest-json-report = "^1.5.0"
pytest-repeat = "^0.9.4"
pytest-rerunfailures = "^16.7"
pytest-timeout = "^2.3.1"
pytest-xdist = "^3.5"
python = "^3.12.0"
PyYAML = "^6.0"
requests = "^2.32.4"
requests-unixsocket2 = "^1.0.1"
scipy = "^1.11.2"
seaborn = "^0.13.2"
semver = "^3.0.4"
setproctitle = "^1.3.2"
tenacity = "^9.2.1"


[tool.poetry.group.dev.dependencies]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
